<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Modern Color Palette -->
    <linearGradient id="primaryGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A" /> <!-- Deep Slate/Dark Mode Friendly -->
      <stop offset="100%" stop-color="#3B82F6" /> <!-- Vibrant Blue -->
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" /> <!-- Gold -->
      <stop offset="100%" stop-color="#EF4444" /> <!-- Crimson Sunset Accent -->
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fully Transparent Canvas — Fits smoothly on dark or light web headers -->

  <g transform="translate(40, 10)">
    <!-- SHOPPING BAG ICON (Left Aligned & Scaled Big) -->
    <g filter="url(#softShadow)" transform="translate(0, 10)">
      <!-- Outer Bag Structure -->
      <path d="M45 40 L135 40 C160 40 170 50 170 75 L170 160 C170 185 160 195 135 195 L45 195 C20 195 10 185 10 160 L10 75 C10 50 20 40 45 40 Z" 
            fill="none" 
            stroke="url(#primaryGradient)" 
            stroke-width="14" 
            stroke-linejoin="round"
            stroke-linecap="round"/>
      
      <!-- Premium Bag Handle -->
      <path d="M60 40 C60 0, 120 0, 120 40" 
            fill="none" 
            stroke="url(#accentGradient)" 
            stroke-width="12" 
            stroke-linecap="round"/>

      <!-- Integrated Clothing Fold Motif -->
      <path d="M25 130 C50 110 130 150 155 130 C155 155 130 165 25 130 Z" 
            fill="url(#primaryGradient)" 
            opacity="0.95"/>
            
      <!-- Dynamic Shoe Sole Stitching Ribbon -->
      <path d="M12 75 C35 55, 145 95, 168 75" 
            fill="none" 
            stroke="url(#accentGradient)" 
            stroke-width="5" 
            stroke-dasharray="10 8"
            stroke-linecap="round"/>
    </g>

    <!-- BRAND TYPOGRAPHY (Right Aligned to Icon) -->
    <g transform="translate(210, 0)">
      <!-- Main Brand Name: AJAY -->
      <text x="0" y="115" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="82" 
            font-weight="900" 
            letter-spacing="12" 
            fill="url(#primaryGradient)">
        AJAY
      </text>

      <!-- Subtitle: SHOES & CLOTHING -->
      <text x="5" y="160" 
            font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
            font-size="22" 
            font-weight="700" 
            letter-spacing="9" 
            fill="#64748B">
        SHOES &amp; CLOTHING
      </text>

      <!-- Accent Underline Detail -->
      <line x1="5" y1="180" x2="420" y2="180" stroke="url(#accentGradient)" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
